<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password - PAI SD Kelas 4</title>

    <link rel="stylesheet" href="css/modern-style.css">

    <style>
        input:focus {
            outline: none;
            border-color: var(--color-primary) !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #c6f6d5;
            color: #276749;
        }

        .message.error {
            display: block;
            background: #fed7d7;
            color: #c53030;
        }
    </style>
</head>

<body>

    <div style="
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    ">

        <div class="glass-container" style="max-width: 480px; width: 100%;">

            <!-- Header -->
            <div style="text-align: center; margin-bottom: 35px;">

                <div
                    style="font-size: 70px; margin-bottom: 18px;"
                    class="icon-bounce">
                    🔐
                </div>

                <h1 style="
                    font-family: 'Fredoka', sans-serif;
                    font-size: 34px;
                    color: #2d3748;
                    margin-bottom: 8px;
                ">
                    Lupa Password?
                </h1>

                <p style="
                    color: #718096;
                    font-size: 15px;
                    line-height: 1.6;
                ">
                    Masukkan email yang terdaftar pada akun Guru SIPAI-4.
                    Link untuk mengatur ulang password akan dikirim melalui email.
                </p>

            </div>


            <!-- Form Reset -->
            <form id="resetForm">

                <div style="margin-bottom: 24px;">

                    <label
                        for="email"
                        style="
                            display: block;
                            margin-bottom: 8px;
                            font-weight: 600;
                            color: #2d3748;
                        ">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="masukkan email guru"
                        style="
                            width: 100%;
                            padding: 14px 20px;
                            border: 2px solid #e2e8f0;
                            border-radius: var(--radius-md);
                            font-size: 16px;
                            transition: all 0.3s;
                            font-family: 'Poppins', sans-serif;
                        ">
                </div>


                <button
                    type="submit"
                    id="resetBtn"
                    class="btn-modern btn-primary"
                    style="
                        width: 100%;
                        justify-content: center;
                        font-size: 18px;
                        padding: 16px;
                    ">
                    Kirim Link Reset Password
                </button>


                <div id="message" class="message"></div>

            </form>


            <!-- Kembali Login -->
            <div style="
                text-align: center;
                margin-top: 30px;
                padding-top: 30px;
                border-top: 1px solid #e2e8f0;
            ">

                <p style="
                    color: #718096;
                    margin-bottom: 12px;
                ">
                    Sudah ingat password?
                </p>

                <a
                    href="login.html"
                    style="
                        color: var(--color-primary);
                        font-weight: 600;
                        text-decoration: none;
                    ">
                    ← Kembali ke Login
                </a>

            </div>

        </div>

    </div>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script src="js/firebase-config.js"></script>


    <script>

        const resetForm = document.getElementById('resetForm');

        const emailInput = document.getElementById('email');

        const resetBtn = document.getElementById('resetBtn');

        const message = document.getElementById('message');


        resetForm.addEventListener('submit', async function(e) {

            e.preventDefault();


            const email = emailInput.value.trim();


            // Reset pesan
            message.className = 'message';

            message.textContent = '';


            if (!email) {

                showError('Email harus diisi.');

                return;

            }


            try {

                // Loading
                resetBtn.disabled = true;

                resetBtn.textContent = '⏳ Mengirim...';


                // Kirim reset password
                await firebase
                    .auth()
                    .sendPasswordResetEmail(email);


                // Berhasil
                message.className = 'message success';

                message.innerHTML = `
                    ✅ Link reset password berhasil dikirim.<br>
                    Silakan periksa kotak masuk atau folder spam email Anda.
                `;


                emailInput.value = '';


            } catch (error) {

                console.error(
                    'Reset password error:',
                    error
                );


                let errorMessage =
                    'Gagal mengirim link reset password. Silakan coba lagi.';


                if (error.code === 'auth/invalid-email') {

                    errorMessage =
                        'Format email tidak valid.';

                }

                else if (error.code === 'auth/too-many-requests') {

                    errorMessage =
                        'Terlalu banyak permintaan. Silakan coba lagi beberapa saat.';

                }

                else if (error.code === 'auth/network-request-failed') {

                    errorMessage =
                        'Koneksi internet bermasalah.';

                }


                showError(errorMessage);


            } finally {

                resetBtn.disabled = false;

                resetBtn.textContent =
                    'Kirim Link Reset Password';

            }

        });


        function showError(text) {

            message.className =
                'message error';

            message.textContent =
                '❌ ' + text;

        }

    </script>

</body>
</html>
