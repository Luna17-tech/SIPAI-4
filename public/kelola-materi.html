<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Materi - Dashboard Guru</title>
    <link rel="stylesheet" href="css/modern-style.css">
</head>
<body>
    <div class="glass-container" style="max-width: 1200px; margin: 40px auto;">
        
        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 32px; gap:16px; flex-wrap:wrap;">
            <div>
                <h1 style="font-family:'Fredoka',sans-serif; font-size:42px; background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px;">
                    📚 Kelola Materi
                </h1>
                <p style="color:#718096; font-size:18px;">
                    Tambah, ubah, dan hapus materi PAI Kelas 4.
                </p>
            </div>

            <a href="dashboard-guru.html" class="btn-modern btn-primary">
                ← Kembali
            </a>
        </div>

        <!-- Form Materi -->
        <div class="modern-card" style="margin-bottom: 32px;">
            <h2 style="font-family:'Fredoka',sans-serif; color:#2d3748; margin-bottom:20px;">
                ✏️ Form Materi
            </h2>

            <input type="hidden" id="materiId">

            <div style="display:grid; gap:16px;">
                <div>
                    <label style="font-weight:600; color:#2d3748;">Judul Materi</label>
                    <input type="text" id="judulMateri" placeholder="Contoh: Bab 1 - Keragaman"
                           style="width:100%; padding:14px; border-radius:12px; border:1px solid #e2e8f0; margin-top:8px;">
                </div>

                <div>
                    <label style="font-weight:600; color:#2d3748;">Ikon / Emoji</label>
                    <input type="text" id="ikonMateri" placeholder="Contoh: 📖"
                           style="width:100%; padding:14px; border-radius:12px; border:1px solid #e2e8f0; margin-top:8px;">
                </div>

                <div>
                    <label style="font-weight:600; color:#2d3748;">Deskripsi Singkat</label>
                    <textarea id="deskripsiMateri" rows="3" placeholder="Tulis deskripsi singkat materi..."
                              style="width:100%; padding:14px; border-radius:12px; border:1px solid #e2e8f0; margin-top:8px;"></textarea>
                </div>

                <div>
                    <label style="font-weight:600; color:#2d3748;">Isi Materi</label>
                    <textarea id="isiMateri" rows="8" placeholder="Tulis isi lengkap materi..."
                              style="width:100%; padding:14px; border-radius:12px; border:1px solid #e2e8f0; margin-top:8px;"></textarea>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button onclick="simpanMateri()" class="btn-modern btn-success" style="border:none; cursor:pointer;">
                        💾 Simpan Materi
                    </button>

                    <button onclick="resetFormMateri()" class="btn-modern btn-warning" style="border:none; cursor:pointer;">
                        🔄 Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Daftar Materi -->
        <div>
            <h2 style="font-family:'Fredoka',sans-serif; color:#2d3748; margin-bottom:20px;">
                📋 Daftar Materi
            </h2>

            <div id="materiList" style="display:grid; gap:18px;">
                <div class="modern-card">
                    <p style="color:#718096;">Memuat data materi...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script src="js/utils.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/kelola-materi.js"></script>
</body>
</html>
