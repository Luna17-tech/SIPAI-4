<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif - Geometri SD</title>
    <link rel="stylesheet" href="css/modern-style.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/confetti.css">
    <style>
        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .quiz-header {
            background: var(--gradient-primary);
            color: white;
            padding: 40px;
            border-radius: var(--radius-xl);
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-timer {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 18px;
            font-weight: 600;
        }

        .quiz-timer.warning {
            background: #f56565;
            animation: pulse 1s infinite;
        }

        .question-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-xl);
            margin-bottom: 30px;
        }

        .question-number {
            display: inline-block;
            background: var(--gradient-success);
            color: white;
            padding: 8px 20px;
            border-radius: 100px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 20px 24px;
            margin-bottom: 16px;
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .option-btn:hover {
            border-color: var(--color-primary);
            transform: translateX(8px);
            box-shadow: var(--shadow-md);
        }

        .option-btn.selected {
            background: var(--gradient-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .option-btn.correct {
            background: var(--gradient-success);
            color: white;
            border-color: #48bb78;
        }

        .option-btn.wrong {
            background: #fed7d7;
            color: #c53030;
            border-color: #fc8181;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .explanation-box {
            display: none;
            background: #ebf8ff;
            border-left: 4px solid #4299e1;
            padding: 20px;
            border-radius: var(--radius-md);
            margin-top: 20px;
        }

        .explanation-box.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .progress-bar-quiz {
            height: 8px;
            background: #e2e8f0;
            border-radius: 100px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill-quiz {
            height: 100%;
            background: var(--gradient-success);
            transition: width 0.5s ease;
        }

        .quiz-actions {
            display: flex;
            gap: 16px;
            justify-content: space-between;
        }

        .result-card {
            text-align: center;
            padding: 60px 40px;
        }

        .result-score {
            font-size: 120px;
            font-family: 'Fredoka', sans-serif;
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .result-grade {
            font-size: 48px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <!-- Quiz Header -->
        <div class="quiz-header">
            <h1 id="quizTitle" style="font-family: 'Fredoka', sans-serif; font-size: 42px; margin-bottom: 16px;">
                🔺 Kuis Segitiga
            </h1>
            <div class="quiz-timer" id="timer">
                ⏱️ <span id="timeDisplay">15:00</span>
            </div>
            <div style="margin-top: 20px; font-size: 16px; opacity: 0.9;">
                <span id="difficultyBadge">⭐ Mudah</span> • <span id="totalQuestions">10 Soal</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-quiz">
            <div class="progress-fill-quiz" id="quizProgress" style="width: 0%;"></div>
        </div>

        <!-- Question Card -->
        <div class="question-card" id="questionCard">
            <span class="question-number" id="questionNumber">Soal 1/10</span>
            <h2 class="question-text" id="questionText">Loading...</h2>
            
            <div id="optionsContainer"></div>

            <div class="explanation-box" id="explanationBox">
                <strong style="color: #2c5282; font-size: 16px;">💡 Penjelasan:</strong>
                <p id="explanationText" style="color: #2d3748; margin-top: 8px;"></p>
            </div>

            <div class="quiz-actions" style="margin-top: 30px;">
                <button class="btn-modern" style="background: #e2e8f0; color: #2d3748;" id="prevBtn" onclick="previousQuestion()" disabled>
                    ← Sebelumnya
                </button>
                <button class="btn-modern btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
                    Selanjutnya →
                </button>
                <button class="btn-modern btn-success" id="submitBtn" onclick="submitQuiz()" style="display: none;">
                    ✅ Selesai
                </button>
            </div>
        </div>

        <!-- Result Card (hidden initially) -->
        <div class="question-card result-card" id="resultCard" style="display: none;">
            <div class="result-score" id="resultScore">85</div>
            <div class="result-grade" id="resultGrade">🎉 Bagus Sekali!</div>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 40px 0;">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--gradient-success);">✅</div>
                    <div class="stat-content">
                        <h3 id="correctCount">8</h3>
                        <p>Benar</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--gradient-warning);">❌</div>
                    <div class="stat-content">
                        <h3 id="wrongCount">2</h3>
                        <p>Salah</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--gradient-info);">⏱️</div>
                    <div class="stat-content">
                        <h3 id="timeTaken">12:45</h3>
                        <p>Waktu</p>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a href="kuis.html" class="btn-modern btn-primary">
                    🏠 Kembali ke Daftar Kuis
                </a>
                <button class="btn-modern btn-success" onclick="retakeQuiz()">
                    🔄 Ulangi Kuis
                </button>
                <a href="achievements.html" class="btn-modern btn-warning">
                    🏆 Lihat Achievements
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/quiz-play-firebase.js"></script>
   
</body>
</html>
